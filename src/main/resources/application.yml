spring:
  application:
    name: gestor-salon-eventos

  profiles:
    # 'local' carga application-local.yml (gitignoreado) con los secretos de tu
    # máquina. En producción se arranca con --spring.profiles.active=prod y los
    # secretos llegan por variables de entorno del contenedor.
    active: dev,local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # Configuración de Archivos
  # 4 MB por archivo: el mismo límite que el frontend y que la Lambda de imágenes, que recibe
  # hasta 6 MB por llamada con el archivo en base64. La petición completa puede pesar un poco más.
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 5MB

server:
  port: 8080
  servlet:
    context-path: /api/v1
  error:
    include-message: always

app:
  # JWT
  # SIN valor por defecto a propósito: si la variable/archivo local no está, la app
  # debe FALLAR al arrancar en vez de usar una clave publicada en el repo.
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000  # 24 horas

  # Cloudinary (credenciales de cuenta; nunca se versionan)
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
