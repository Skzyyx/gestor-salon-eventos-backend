name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Crucial: fetch-depth 0 permite que Sonar compare las diferencias entre ramas

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_GOAL: org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mvn -B verify "$SONAR_GOAL" \
              -Dsonar.projectKey=gestor-salon-eventos-backend \
              -Dsonar.qualitygate.wait=true \
              -Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
              -Dsonar.pullrequest.branch=${{ github.head_ref }} \
              -Dsonar.pullrequest.base=${{ github.base_ref }}
          else
            mvn -B verify "$SONAR_GOAL" \
              -Dsonar.projectKey=gestor-salon-eventos-backend \
              -Dsonar.qualitygate.wait=true \
              -Dsonar.branch.name=${{ github.ref_name }}
          fi
