name: CI

# Every push, on any branch, and every pull request to main run the tests.
on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build:
    # Keep this name: "Build" is the status check the main ruleset requires.
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: Sonar needs it to detect new code and blame lines

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Phase 1: compile, run every test, write the JaCoCo report and check the coverage
      # gate (at least 80% of lines and branches, see "coverage-gate" in pom.xml). A red
      # "Build and test" means a broken test or coverage below the minimum; the log and
      # the summaries below say which.
      - name: Build and test
        run: mvn -B test jacoco:report jacoco:check@coverage-gate

      # Runs even when the previous step failed: lists every failing test with its
      # expected and actual values on the run page.
      - name: Test summary
        if: always()
        run: python3 .github/scripts/test-summary.py target/surefire-reports >> "$GITHUB_STEP_SUMMARY"

      # Also runs when the previous steps failed: line, branch and instruction coverage
      # against the 80% minimum, and the classes with the most uncovered lines.
      - name: Coverage summary
        if: always()
        run: python3 .github/scripts/coverage-summary.py target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      # Avance 3: build the image on every run, tagged with the commit SHA, so each image
      # points to exactly one commit. On a pull request GITHUB_SHA is a temporary merge
      # commit, so the head commit of the branch is used instead. The image is not pushed:
      # Nexus credentials only live in each member's settings.xml and docker login.
      - name: Build Docker image
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker build -t "gestor-salon-eventos:${COMMIT_SHA}" .
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" gestor-salon-eventos

      # Phase 2: analysis and quality gate on what phase 1 compiled. A red step here
      # means the gate failed, not a test. Only for pull requests and main: a push to a
      # feature branch is already analysed by its pull request.
      - name: SonarQube analysis
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_GOAL: org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          # Passed through env, never interpolated into the script: a branch name is user input.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            mvn -B "$SONAR_GOAL" \
              -Dsonar.projectKey=gestor-salon-eventos-backend \
              -Dsonar.qualitygate.wait=true \
              -Dsonar.pullrequest.key="$PR_NUMBER" \
              -Dsonar.pullrequest.branch="$HEAD_REF" \
              -Dsonar.pullrequest.base="$BASE_REF"
          else
            mvn -B "$SONAR_GOAL" \
              -Dsonar.projectKey=gestor-salon-eventos-backend \
              -Dsonar.qualitygate.wait=true \
              -Dsonar.branch.name="$GITHUB_REF_NAME"
          fi
